[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-core = { workspace = true }
orbit-project = { workspace = true }
orbit-actions = { workspace = true }
orbit-providers = { workspace = true }
orbit-agent = { workspace = true }
orbit-mcp-server = { workspace = true }
orbit-workspace = { workspace = true }
orbit-session = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-std", "io-util", "sync", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
orbit-core = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"

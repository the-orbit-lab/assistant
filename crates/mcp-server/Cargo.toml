[package]
name = "orbit-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
orbit-core = { workspace = true }
orbit-actions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-std", "macros"] }
rmcp = { workspace = true, features = ["server", "transport-io"] }
tracing = { workspace = true }

[dev-dependencies]
orbit-project = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
rmcp = { workspace = true, features = ["client"] }

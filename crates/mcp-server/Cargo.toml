[package]
name = "orbit-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
orbit-core = { workspace = true }
orbit-project = { workspace = true }
orbit-actions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "macros", "time"] }
# "client" is used only by self_check.rs, which talks to this crate's own
# server over an in-process duplex pipe to power `orbit doctor`'s "can the
# MCP server initialize" check -- not to consume other servers (that's
# orbit-mcp-client's job).
rmcp = { workspace = true, features = ["server", "client", "transport-io"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[package]
name = "orbit-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
orbit-core = { workspace = true }
orbit-project = { workspace = true }
orbit-actions = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "io-util", "time"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
